# Controls catalog — columns of the matrix.
#
# Every control MUST answer the two judging criteria:
#   1. verifiable_externally: can a third party check it WITHOUT network access? how?
#   2. impl_cost / operating_cost: low | med | high, plus a one-line note.
#
# category: prevent | detect | contain
# evidence_required: the concrete artifact(s) a third party would ask for.
#
# This is a CANDIDATE list. Add, merge or drop controls as the analysis demands.
# Keep ids stable once matrix.csv references them.

controls:
  - id: C01
    name: Sandbox egress default-deny with allowlisted registry proxy
    description: >
      Evaluation sandboxes have no direct internet. Only egress is a package-registry
      proxy on an explicit allowlist; all other outbound traffic dropped and logged.
    category: prevent
    verifiable_externally:
      value: true
      how: "TODO — e.g. published sandbox network policy + signed attestation of the egress allowlist"
    impl_cost:
      level: low
      note: "TODO"
    operating_cost:
      level: low
      note: "TODO"
    evidence_required: "TODO — e.g. redacted NetworkPolicy / firewall ruleset, attestation, third-party sandbox audit letter"

  - id: C02
    name: Egress proxy isolated in its own trust boundary
    description: >
      The registry cache proxy runs outside the sandbox host's network namespace with
      no route back into internal infrastructure; a proxy compromise yields nothing but
      the proxy.
    category: contain
    verifiable_externally:
      value: true
      how: "TODO — architecture doc + attestation; proxy reachable only from sandbox CIDR"
    impl_cost:
      level: med
      note: "TODO"
    operating_cost:
      level: low
      note: "TODO"
    evidence_required: "TODO"

  - id: C03
    name: Public challenge/compute servers hardened (non-root, no unauthenticated RCE surface)
    description: >
      Any internet-facing helper server runs as an unprivileged user, has authentication
      in front of code-execution features, and is inventoried.
    category: prevent
    verifiable_externally:
      value: true
      how: "TODO — externally scannable (unauthenticated probe), public asset inventory"
    impl_cost:
      level: low
      note: "TODO"
    operating_cost:
      level: low
      note: "TODO"
    evidence_required: "TODO"

  - id: C04
