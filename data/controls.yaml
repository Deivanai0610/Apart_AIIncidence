    description: >
      Config parsing (HDF5, YAML, JSON) treats every path as remote/repo-relative;
      absolute or traversal paths are rejected before any I/O.
    category: prevent
    verifiable_externally:
      value: true
      how: "TODO — open-source loader code is public; reproducible test case"
    impl_cost:
      level: low
      note: "TODO"
    operating_cost:
      level: low
      note: "TODO"
    evidence_required: "TODO — commit / test in public repo"

  - id: C05
    name: Template rendering uses Jinja2 SandboxedEnvironment (no exec reach)
    description: >
      All user-supplied templates render in a sandboxed environment with attribute
      access and builtins restricted; rendering runs in a separate low-privilege process.
    category: prevent
    verifiable_externally:
      value: true
      how: "TODO — public code path; black-box SSTI probe on public surface"
    impl_cost:
      level: low
      note: "TODO"
    operating_cost:
      level: low
      note: "TODO"
    evidence_required: "TODO"

