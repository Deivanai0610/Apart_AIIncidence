[project]
name = "chimera-containment-harness"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.12,<3",
    "httpx>=0.28,<1",
    "PyYAML>=6,<7",
]

[project.scripts]
chimera = "chimera.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=9,<10",
    "pytest-asyncio>=1.3,<2",
]

[tool.setuptools]
packages = ["chimera"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "docker: requires the authorized local Docker range",
    "paid: requires explicit paid-provider authorization",
]
